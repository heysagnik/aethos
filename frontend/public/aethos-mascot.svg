<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Aethos">
  <title>Aethos</title>
  <defs>
    <radialGradient id="olive" cx="32%" cy="24%" r="95%">
      <stop offset="0" stop-color="#d9f2a0"/>
      <stop offset=".55" stop-color="#a3c85a"/>
      <stop offset="1" stop-color="#6f9a2f"/>
    </radialGradient>
  </defs>

  <!-- the mascot is the whole icon: a green square with a face -->
  <rect width="256" height="256" rx="52" fill="url(#olive)"/>
  <path d="M30 78V66Q30 34 62 34H98" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="12" stroke-linecap="round"/>

  <g transform="translate(128 134) scale(1.8) translate(-128 -150)">
    <!-- eyes -->
    <ellipse cx="104" cy="140" rx="6.5" ry="8" fill="#1c1917"/>
    <ellipse cx="152" cy="140" rx="6.5" ry="8" fill="#1c1917"/>
    <circle cx="106.5" cy="136.5" r="2.2" fill="#fff"/>
    <circle cx="154.5" cy="136.5" r="2.2" fill="#fff"/>

    <!-- small round glasses -->
    <g fill="#fff" fill-opacity=".14" stroke="#292524" stroke-width="3.5" stroke-linecap="round">
      <circle cx="104" cy="140" r="17"/>
      <circle cx="152" cy="140" r="17"/>
      <path d="M121 138Q128 133 135 138" fill="none"/>
      <path d="M87 138L76 134M169 138L180 134" fill="none"/>
    </g>
    <path d="M93 130Q98 125 105 124" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M141 130Q146 125 153 124" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round"/>

    <!-- cheeks and smile -->
    <ellipse cx="86" cy="162" rx="11" ry="7" fill="#fb7185" opacity=".6"/>
    <ellipse cx="170" cy="162" rx="11" ry="7" fill="#fb7185" opacity=".6"/>
    <path d="M116 160Q128 172 140 160" fill="none" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
