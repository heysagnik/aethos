[project]
name = "aethos"
version = "0.1.0"
description = "Aethos: context-efficient AI pull request reviewer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "django>=5.1,<5.3",
  "django-ninja>=1.3",
  "pydantic>=2.8",
  "psycopg[binary]>=3.2",
  "dj-database-url>=2.2",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.9",
  "qstash>=2.0",
  "pyyaml>=6.0",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-django>=4.9",
  "ruff>=0.6",
  "mypy>=1.11",
  "django-stubs>=5.1",
  "respx>=0.21",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "aethos.settings.test"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*", "frontend", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "DJ", "S", "RUF"]
ignore = ["S101", "RUF012", "DJ001", "DJ008"]

[tool.ruff.lint.isort]
known-first-party = ["core", "apps", "aethos", "tests"]

[tool.ruff.lint.per-file-ignores]
"**/settings/test.py" = ["S105"]
"**/tests/**" = ["S105", "S106", "S311", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["migrations", "tests"]

[tool.django-stubs]
django_settings_module = "aethos.settings.base"
